<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Fullscreen Test</title>
  <style>
    /* Completely lock the root page viewport dimensions */
    html, body { 
      margin: 0 !important; 
      padding: 0 !important; 
      width: 100% !important; 
      height: 100% !important; 
      overflow: hidden !important; 
      background-color: #000000 !important; 
    }
    
    /* Enforce flexible element sizing boundaries */
    .video-container { 
      position: absolute !important; 
      top: 0 !important; 
      left: 0 !important; 
      width: 100% !important; 
      height: 100% !important;
      overflow: hidden !important;
    }
    
    /* Flatten any hidden overflow blocks inside the frame */
    iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <iframe 
      src="https://play.champds.com/timea/live/5?autoplay=1&mute=1" 
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
